name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mvet
          POSTGRES_USER: mvet
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mvet" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-for-tests-never-use-in-production-2026
      POSTGRES_HOST: localhost
      POSTGRES_DB: mvet
      POSTGRES_USER: mvet
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py setup_mvet
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --verbosity 2
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test apps.inventory.test_browser apps.sales.test_browser --verbosity 2
        env:
          MVET_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-ui-review
          path: artifacts/*.png
          if-no-files-found: ignore
