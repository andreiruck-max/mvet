name: MVet 3 laboratory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolated-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/mvet3_lab.py init
      - run: python scripts/mvet3_lab.py build
      - run: python scripts/mvet3_lab.py start-db
      - run: python scripts/mvet3_lab.py audit
      - run: python scripts/mvet3_lab.py migrate
      - run: python scripts/mvet3_lab.py setup
      - run: python scripts/mvet3_lab.py check
      - run: python scripts/mvet3_lab.py restore-test
      - run: python scripts/mvet3_lab.py up
      - name: Verify HTTP and blocked egress
        run: |
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8001/entrar/ -o /dev/null
          docker compose --project-name mvet3 --env-file .env.mvet3 --file compose.mvet3.yml exec -T lab-web python -c "import socket; s=socket.socket(); s.settimeout(3); result=s.connect_ex(('1.1.1.1',443)); s.close(); assert result != 0, 'External egress is available'"
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_mvet3_browser.py
      - name: Stop laboratory without removing data
        if: always()
        run: python scripts/mvet3_lab.py stop
